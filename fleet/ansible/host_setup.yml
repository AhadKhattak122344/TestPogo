- name: Configure ARM64 host
  hosts: arm_hosts
  become: true

  vars:
    bridge_iface: eno1
    bridge_ip: 10.0.0.10
    bridge_cidr: 24
    bridge_gw: 10.0.0.1

  tasks:
    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [kvm, optee, vfio, vfio_platform, vfio_iommu_type1]

    - name: Persist modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/fleet.conf
        content: |
          kvm
          optee
          vfio
          vfio_platform
          vfio_iommu_type1

    - name: Install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - qemu-system-arm
          - qemu-efi-aarch64
          - libvirt-daemon-system
          - libvirt-clients
          - virtinst
          - bridge-utils
          - zfsutils-linux
          - optee-client
          - optee-test
          - python3-pip
          - python3-venv
          - adb
        state: present

    - name: Enable libvirtd
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started

    - name: Enable tee-supplicant
      ansible.builtin.systemd:
        name: tee-supplicant
        enabled: true
        state: started

    - name: Configure bridge
      ansible.builtin.copy:
        dest: /etc/netplan/01-br0.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            bridges:
              br0:
                interfaces: [{{ bridge_iface }}]
                addresses: [{{ bridge_ip }}/{{ bridge_cidr }}]
                gateway4: {{ bridge_gw }}
                nameservers:
                  addresses: [1.1.1.1, 8.8.8.8]

    - name: Apply netplan
      ansible.builtin.command: netplan apply
      changed_when: true

    - name: Register libvirt pool
      ansible.builtin.shell: |
        virsh pool-define-as guests dir --target /var/lib/libvirt/images || true
        virsh pool-start guests || true
        virsh pool-autostart guests || true
      changed_when: true

    - name: Create /opt/fleet
      ansible.builtin.file:
        path: /opt/fleet
        state: directory
        mode: "0755"

    - name: Verify TEE device
      ansible.builtin.stat:
        path: /dev/tee0
      register: tee

    - name: Fail if no TEE
      ansible.builtin.fail:
        msg: "/dev/tee0 missing - OP-TEE not initialized"
      when: not tee.stat.exists
